<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitals | Members</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .logo {
            margin-top: 40px;
            margin-bottom: 40px;
        }

        #user-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
            font-size: 1.2rem;
        }

        .user {
            background: #111;
            padding: 10px 20px;
            border: 1px solid #333;
            border-radius: 5px;
            min-width: 200px;
        }
    </style>
</head>
<body>

    <!-- Logo -->
    <img src="https://files.catbox.moe/hln3gt.gif" alt="Vitals Logo" class="logo">

    <!-- Container for the users -->
    <div id="user-list">Loading members...</div>

    <script>
        // Fetch the users.wtf file
        fetch('users.wtf')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Could not find users.wtf");
                }
                return response.text();
            })
            .then(data => {
                const userListContainer = document.getElementById('user-list');
                userListContainer.innerHTML = ''; // Clear loading text
                
                // Split the text file by new lines, remove empty lines
                const users = data.split('\n').filter(user => user.trim() !== '');

                // Display each user
                users.forEach(user => {
                    const div = document.createElement('div');
                    div.className = 'user';
                    div.textContent = user.trim();
                    userListContainer.appendChild(div);
                });
            })
            .catch(error => {
                document.getElementById('user-list').innerHTML = `<span style="color:red;">Error: ${error.message}</span>`;
            });
    </script>

</body>
</html>
